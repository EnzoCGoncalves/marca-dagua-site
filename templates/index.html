<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#111111">

    <title>Marca D'água</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <h1>Marca D'água</h1>

        <p class="subtitulo">
            Coloque sua marca no centro de várias fotos de uma vez
        </p>

        <form id="formulario"
            method="POST"
            enctype="multipart/form-data">

            <!-- ==========================================
                 ESCOLHER VÁRIAS FOTOS
                 ========================================== -->

            <div class="campo">

                <label for="fotos">
                    📷 Escolha suas fotos
                </label>

                <input
                    type="file"
                    id="fotos"
                    name="fotos"
                    accept="image/*"
                    capture="environment"
                    multiple
                    required
                >

                <p id="contador" class="ajuda">
                    Nenhuma foto selecionada
                </p>

            </div>


            <!-- ==========================================
                 ESCOLHER A MARCA
                 ========================================== -->

            <div class="campo">

                <label for="marca">
                    🖼️ Escolha sua marca
                </label>

                <input
                    type="file"
                    id="marca"
                    name="marca"
                    accept="image/*"
                    required
                >

                <p id="nomeMarca" class="ajuda">
                    Nenhuma marca selecionada
                </p>

            </div>


            <!-- ==========================================
                 CONFIGURAÇÕES
                 ========================================== -->

            <section class="configuracoes">

                <h2>Configurações</h2>

                <label for="opacidade">
                    Opacidade:
                    <strong id="valorOpacidade">30%</strong>
                </label>

                <input
                    type="range"
                    id="opacidade"
                    name="opacidade"
                    min="1"
                    max="100"
                    value="30"
                >


                <label for="tamanho">
                    Tamanho da marca:
                    <strong id="valorTamanho">30%</strong>
                </label>

                <input
                    type="range"
                    id="tamanho"
                    name="tamanho"
                    min="5"
                    max="80"
                    value="30"
                >

            </section>


            <!-- ==========================================
                 BOTÃO
                 ========================================== -->

            <button id="botao" type="submit">
                🚀 Aplicar e baixar ZIP
            </button>

            <p id="status" class="status" aria-live="polite"></p>

        </form>

    </main>


    <script>

        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formulario = document.getElementById("formulario");
        const fotos = document.getElementById("fotos");
        const marca = document.getElementById("marca");
        const contador = document.getElementById("contador");
        const nomeMarca = document.getElementById("nomeMarca");
        const botao = document.getElementById("botao");
        const status = document.getElementById("status");


        // ==========================================
        // CONTADOR DE FOTOS
        // ==========================================

        fotos.addEventListener("change", function () {

            const quantidade = fotos.files.length;

            if (quantidade === 0) {
                contador.textContent = "Nenhuma foto selecionada";
            } else if (quantidade === 1) {
                contador.textContent = "1 foto selecionada";
            } else {
                contador.textContent =
                    quantidade + " fotos selecionadas";
            }

        });


        // ==========================================
        // NOME DA MARCA
        // ==========================================

        marca.addEventListener("change", function () {

            if (marca.files.length > 0) {
                nomeMarca.textContent =
                    "Marca: " + marca.files[0].name;
            } else {
                nomeMarca.textContent =
                    "Nenhuma marca selecionada";
            }

        });


        // ==========================================
        // OPACIDADE
        // ==========================================

        const opacidade = document.getElementById("opacidade");
        const valorOpacidade =
            document.getElementById("valorOpacidade");

        opacidade.addEventListener("input", function () {
            valorOpacidade.textContent =
                opacidade.value + "%";
        });


        // ==========================================
        // TAMANHO
        // ==========================================

        const tamanho = document.getElementById("tamanho");
        const valorTamanho =
            document.getElementById("valorTamanho");

        tamanho.addEventListener("input", function () {
            valorTamanho.textContent =
                tamanho.value + "%";
        });


        // ==========================================
        // ENVIO
        // ==========================================

        formulario.addEventListener("submit", function () {

            // Evita que a pessoa clique várias vezes
            botao.disabled = true;
            botao.textContent = "⏳ Processando fotos...";

            status.textContent =
                "Isso pode levar alguns segundos. Não feche esta página.";

        });

    </script>

</body>

</html>
